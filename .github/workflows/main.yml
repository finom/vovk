name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - 'biome.json'
      - 'tsconfig.json'
      - '.github/workflows/main.yml'
      - '!**/*.md'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - 'biome.json'
      - 'tsconfig.json'
      - '.github/workflows/main.yml'
      - '!**/*.md'
  schedule:
    # nightly: every OS and Node version, and the yarn, bun and pnpm init specs
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  matrix:
    # a pull request runs one OS and one Node version; for the full matrix on a branch, run the workflow by hand
    runs-on: ubuntu-24.04
    outputs:
      os: ${{ steps.pick.outputs.os }}
      node: ${{ steps.pick.outputs.node }}
    steps:
      - id: pick
        env:
          FULL: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ "$FULL" = true ]; then
            echo 'os=["ubuntu-24.04","macos-latest"]' >> "$GITHUB_OUTPUT"
            echo 'node=[22,24,26]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-24.04"]' >> "$GITHUB_OUTPUT"
            echo 'node=[24]' >> "$GITHUB_OUTPUT"
          fi

  gate:
    # lint, types and the fast unit tests, so a broken change fails in minutes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/package-lock.json
      - run: npm ci && npm --prefix test ci
      - run: npm run build
      - run: npm run lint
      - run: npx turbo run tsc --dangerously-disable-package-manager-check
      - run: npm --prefix test run generate && npm --prefix test run build-other-compiled-sources
      - run: npx tsc --project ./test
      - run: npx tsc --project ./test/tsconfig.non-strict.json
      - run: npm run unit:ts --prefix packages/vovk-python && npm run unit:ts --prefix packages/vovk-rust

  integration:
    needs: [matrix, gate]
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix.outputs.os) }}
        node-version: ${{ fromJSON(needs.matrix.outputs.node) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/package-lock.json
      - run: npm ci && npm --prefix test ci
      - run: npm run build
      - run: npm --prefix test run generate && npm --prefix test run build-other-compiled-sources
      - run: npm run unit

  codegen:
    # the generated Python and Rust clients against the built test app
    needs: [matrix, gate]
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix.outputs.os) }}
        node-version: ${{ fromJSON(needs.matrix.outputs.node) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: packages/vovk-python/requirements-ci.txt
      # every package pinned by hash; the file's header has the command that regenerates it
      - run: pip install --require-hashes -r ./packages/vovk-python/requirements-ci.txt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/vovk-rust/test_rust
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/package-lock.json
      - run: npm ci && npm --prefix test ci
      - run: npm run build
      - run: npm --prefix test run generate && npm --prefix test run build-other-compiled-sources
      - run: npm run test:rs
      - run: npm run test:py

  cli:
    needs: [matrix, gate]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix.outputs.os) }}
        shard: [init, dev, bundle, rest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # the init and bundle specs create several Next.js apps, and yarn copies them on every file: install,
      # which overruns the ~14 GB free on stock ubuntu runners
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          package_json_file: ./test/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Run the ${{ matrix.shard }} specs
        working-directory: packages/vovk-cli
        env:
          NODE_ENV: test
          VOVK_TEST_ALL_PACKAGE_MANAGERS: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: |
          case "${{ matrix.shard }}" in
            rest) specs="test/spec/generate/*.mts test/spec/new/*.mts test/spec/critical-utilities/*.mts" ;;
            *) specs="test/spec/${{ matrix.shard }}/*.mts" ;;
          esac
          node --experimental-strip-types --experimental-vm-modules --test --test-concurrency=1 $specs
