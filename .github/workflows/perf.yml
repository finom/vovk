name: Perf

on:
  push:
    branches:
      - main
    paths:
      - 'packages/vovk/**'
      - 'perf/**'
      - '.github/workflows/perf.yml'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run perf-test -w vovk-perf-test
